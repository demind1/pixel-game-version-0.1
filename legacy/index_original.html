function bootAudio(){if(muted)return;if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}if(audioCtx.state==='suspended')audioCtx.resume();}
function sfx(type){if(muted)return;bootAudio();if(!audioCtx)return;const now=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();let f=180,d=.09,wave='square',vol=.025;if(type==='hit'){f=105;d=.07;wave='square';vol=.035;}if(type==='tail'){f=260;d=.12;wave='sawtooth';vol=.026;}if(type==='acid'){f=420;d=.20;wave='sawtooth';vol=.032;}if(type==='hurt'){f=75;d=.16;wave='sawtooth';vol=.04;}if(type==='explosion'){f=48;d=.28;wave='triangle';vol=.05;}if(type==='select'){f=390;d=.06;wave='square';vol=.018;}if(type==='boss'){f=54;d=.42;wave='sawtooth';vol=.045;}if(type==='jump'){f=220;d=.08;wave='square';vol=.018;}
 osc.type=wave;osc.frequency.setValueAtTime(f,now);osc.frequency.exponentialRampToValueAtTime(Math.max(25,f*.42),now+d);gain.gain.setValueAtTime(vol,now);gain.gain.exponentialRampToValueAtTime(.0001,now+d);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+d+.01);

function setMusic(){if(muted){bgm.pause();document.getElementById('musicBtn').textContent='♫ MUSIC OFF';return;}document.getElementById('musicBtn').textContent='♫ MUSIC ON';if(mode==='playing'||mode==='menu'||mode==='paused'){bgm.play().catch(()=>{});}}
function startGame(){bootAudio();score=0;kills=0;combo=0;comboTimer=0;camera=0;spawnIndex=0;bullets=[];particles=[];floaters=[];boss=null;enemies=[];crates=[{x:350,y:180,hp:3},{x:830,y:180,hp:3},{x:1190,y:180,hp:3},{x:1510,y:180,hp:4}];const c=classes[selected];player={x:62,y:222,z:0,vz:0,hp:c.hp,maxHp:c.hp,face:1,ground:true,act:'idle',actT:0,cd:0,specialCd:0,invul:0,stun:0,lives:3,energy:100,step:0,moveX:0,moveY:0};mode='playing';stageStart=performance.now();stageBanner=180;spawnWave(2,player.x+195);setMusic();}
function spawnWave(count,x){for(let i=0;i<count;i++){const heavy=(spawnIndex>=2&&i===count-1)||(spawnIndex===4&&i===1);const xx=x+i*55+Math.random()*28;enemies.push({type:heavy?'heavy':'marine',x:xx,y:202+Math.random()*35,hp:heavy?80:44,maxHp:heavy?80:44,speed:heavy?.42:.62,face:-1,shoot:1+Math.random()*.8,attack:0,stun:0,hurt:0,dead:false,walk:Math.random()*8,fire:false});}spawnIndex++;}

function killEnemy(e){if(e.dead)return;e.dead=true;kills++;addScore(e.type==='heavy'?600:300);combo++;comboTimer=100;particle(e.x,e.y-25,'#a7e45f',14,3);floating(e.x,e.y-55,e.type==='heavy'?'+600':'+300','#f6dc80');sfx('explosion');}
function hurtPlayer(amount,from){const p=player;if(p.invul>0||p.stun>0||p.z>10)return;p.hp-=amount;p.invul=50;p.stun=13;p.x+=(p.x>from?1:-1)*9;shake=4;particle(p.x,p.y-28,'#ff9b61',7,2);sfx('hurt');if(p.hp<=0){p.lives--;if(p.lives>0){p.hp=p.maxHp*.62;p.invul=100;p.x=Math.max(40,p.x-70);p.stun=50;}else{p.hp=0;mode='gameover';bgm.pause();}}}
function attack(kind){if(mode!=='playing')return;const p=player,c=classes[selected];if(p.cd>0||p.stun>0)return;if(kind==='special'&&(p.specialCd>0||p.energy<35))return;p.act=kind;p.actT=kind==='special'?25:kind==='tail'?19:14;p.cd=kind==='special'?36:kind==='tail'?22:15;if(kind==='special'){p.specialCd=210;p.energy-=35;sfx('acid');}else sfx(kind==='tail'?'tail':'hit');const reach=kind==='special'?128:kind==='tail'?92:70;const damage=(kind==='special'?46:kind==='tail'?23:14)*c.damage;let hits=0;
 for(const e of enemies){if(e.dead)continue;const dx=e.x-p.x,dy=Math.abs(e.y-p.y);if(Math.abs(dx)<reach+(e.type==='heavy'?8:0)&&dy<33&&dx*p.face>-16){e.hp-=damage;e.hurt=8;e.stun=8;e.x+=p.face*(kind==='claw'?8:16);hits++;particle(e.x,e.y-22,kind==='special'?'#a7f56c':'#f3e8bf',kind==='special'?12:6,2.8);floating(e.x,e.y-45,String(Math.round(damage)),'#eff7bd');if(e.hp<=0)killEnemy(e);}}

 if(boss){const dx=boss.x-p.x;if(Math.abs(dx)<reach+65&&Math.abs(boss.y-p.y)<62&&dx*p.face>-35){boss.hp-=damage*(kind==='special'?1.2:1);boss.hurt=9;boss.flash=9;boss.x+=p.face*(kind==='tail'?10:4);hits++;particle(boss.x,boss.y-70,'#bbff71',12,3);floating(boss.x,boss.y-100,String(Math.round(damage)),'#d9ff9b');}}
 if(hits){combo+=hits;comboTimer=115;addScore(hits*100*combo);shake=Math.max(shake,kind==='special'?5:2);p.energy=Math.min(100,p.energy+hits*7);}
}
function getInput(){const inp={left:!!keys.left,right:!!keys.right,up:!!keys.up,down:!!keys.down};const gps=navigator.getGamepads?.()||[];for(const gp of gps){if(!gp)continue;const ax=gp.axes?.[0]||0,ay=gp.axes?.[1]||0;inp.left||=ax<-.35||gp.buttons[14]?.pressed;inp.right||=ax>.35||gp.buttons[15]?.pressed;inp.up||=ay<-.35||gp.buttons[12]?.pressed;inp.down||=ay>.35||gp.buttons[13]?.pressed;if(gp.buttons[0]?.pressed&&!keys.gpJump){keys.gpJump=true;keys.jump=true;}if(!gp.buttons[0]?.pressed)keys.gpJump=false;if(gp.buttons[2]?.pressed&&!keys.gpClaw){keys.gpClaw=true;keys.claw=true;}if(!gp.buttons[2]?.pressed)keys.gpClaw=false;if(gp.buttons[3]?.pressed&&!keys.gpTail){keys.gpTail=true;keys.tail=true;}if(!gp.buttons[3]?.pressed)keys.gpTail=false;if(gp.buttons[1]?.pressed&&!keys.gpSpec){keys.gpSpec=true;keys.special=true;}if(!gp.buttons[1]?.pressed)keys.gpSpec=false;}return inp;}
function update(dt){frame++;menuTime+=dt;if(mode!=='playing')return;const step=Math.min(2.2,dt/16.67),p=player,c=classes[selected];if(hitStop>0){hitStop-=dt;return;}if(stageBanner>0)stageBanner-=dt/16.67;if(comboTimer>0)comboTimer-=dt/16.67;else combo=0;if(p.cd>0)p.cd-=step;if(p.specialCd>0)p.specialCd-=step;if(p.actT>0)p.actT-=step;if(p.invul>0)p.invul-=step;if(p.stun>0)p.stun-=step;p.energy=Math.min(100,p.energy+.045*step);
 const inp=getInput();let mx=(inp.right?1:0)-(inp.left?1:0),my=(inp.down?1:0)-(inp.up?1:0);p.moveX=mx;p.moveY=my;if(p.stun<=0){p.x+=mx*c.speed*step*(p.actT>0?.35:1);p.y+=my*.8*step;}if(mx)p.face=Math.sign(mx);p.x=Math.max(22,Math.min(worldW-110,p.x));p.y=Math.max(192,Math.min(243,p.y));p.z+=p.vz*step;p.vz-=.23*step;if(p.z<0){p.z=0;p.vz=0;p.ground=true;}p.step+=Math.abs(mx)*step*.22;
 if(keys.claw){attack('claw');keys.claw=false;}if(keys.tail){attack('tail');keys.tail=false;}if(keys.special){attack('special');keys.special=false;}if(keys.jump&&p.ground&&p.stun<=0){p.vz=4.5;p.ground=false;keys.jump=false;sfx('jump');}if(!p.ground&&keys.jump)keys.jump=false;
 // Enemy waves are triggered by forward progress. Enemies are never spawned behind the active camera.
 while(spawnIndex<waveMarks.length&&p.x>waveMarks[spawnIndex]){const counts=[3,3,4,3,2];spawnWave(counts[spawnIndex],Math.max(p.x+190,waveMarks[spawnIndex]+70));}
 if(p.x>1710&&!boss&&enemies.every(e=>e.dead))makeBoss();
 camera=Math.max(0,Math.min(worldW-W,p.x-155));
 for(const e of enemies){if(e.dead)continue;e.walk+=step*.12;if(e.hurt>0)e.hurt-=step;if(e.stun>0){e.stun-=step;continue;}const dx=p.x-e.x,dy=p.y-e.y,ad=Math.abs(dx);e.face=dx>=0?1:-1;e.shoot-=dt/1000;e.attack-=step;
  if(ad>108){e.x+=Math.sign(dx)*e.speed*step;if(Math.abs(dy)>15)e.y+=Math.sign(dy)*.28*step;}
  else if(ad<52&&Math.abs(dy)<34){if(e.attack<=0){e.attack=66+Math.random()*24;if(p.z<10)hurtPlayer(e.type==='heavy'?12:8,e.x);}}
  else if(e.shoot<=0){e.shoot=1.1+Math.random()*.8;e.fire=true;bullets.push({x:e.x+e.face*20,y:e.y-33,vx:e.face*(e.type==='heavy'?2.8:2.25),vy:(p.y-e.y)*.018,life:130,damage:e.type==='heavy'?11:8,acid:false});}
 }
 if(boss){boss.timer+=step;boss.move+=step;boss.attackCd-=dt/1000;boss.touchCd-=dt/1000;boss.hurt=Math.max(0,boss.hurt-step);boss.flash=Math.max(0,boss.flash-step);boss.phase=boss.hp<boss.maxHp*.3?3:boss.hp<boss.maxHp*.66?2:1;const dx=p.x-boss.x;boss.x+=Math.sign(dx)*.26*step;if(Math.abs(dx)<155&&boss.attackCd<=0){boss.attackCd=boss.phase===3?.95:1.45;if(boss.phase===1){bullets.push({x:boss.x-24,y:boss.y-58,vx:Math.sign(dx)*2.3,vy:(p.y-boss.y)*.02,life:115,damage:13,acid:true});}else{for(let k=-1;k<=1;k++)bullets.push({x:boss.x-18,y:boss.y-50,vx:-2.5,vy:k*.9,life:125,damage:12,acid:true});}sfx('acid');}if(Math.abs(dx)<96&&Math.abs(p.y-boss.y)<58&&boss.touchCd<=0){boss.touchCd=boss.phase===3?.78:1.15;hurtPlayer(boss.phase===3?16:12,boss.x);}if(boss.hp<=0){boss.hp=0;mode='clear';bgm.pause();addScore(5000);particle(boss.x,boss.y-40,'#c4ff76',55,4);sfx('explosion');}}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*step;b.y+=b.vy*step;b.life-=step;if(b.x<camera-50||b.x>camera+W+80||b.life<=0){bullets.splice(i,1);continue;}if(Math.abs(b.x-p.x)<12&&Math.abs(b.y-(p.y-33))<18){hurtPlayer(b.damage,b.x);particle(b.x,b.y,b.acid?'#adff58':'#ffcb74',5,2);bullets.splice(i,1);}}
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*step;q.y+=q.vy*step;q.vy+=.06*step;q.life-=step;if(q.life<=0)particles.splice(i,1);}

function drawBackground(){ctx.fillStyle='#08131e';ctx.fillRect(0,0,W,H);const im=imgs.wall; if(imgReady('wall')){const tw=510,th=227,off=-((camera*.25)%tw);ctx.drawImage(im,off,12,tw,th);ctx.drawImage(im,off+tw,12,tw,th);}else{rect(0,30,W,160,'#172b3b');}

 // far silhouettes

function drawXeno(x,y,cls,row,frameIndex,face=1,alpha=1,scaleExtra=1){const im=imgs.xenos;if(!imgReady('xenos'))return;const c=classes[cls],scale=c.scale*scaleExtra;const fw=im.naturalWidth/4,fh=im.naturalHeight/4;const sx=frameIndex*fw,sy=row*fh;const dw=122*scale,dh=105*scale;ctx.save();ctx.globalAlpha=alpha;ctx.translate(Math.round(x),0);ctx.scale(face,1);ctx.filter=c.hue;ctx.drawImage(im,sx,sy,fw,fh,-dw*.5,y-dh,dw,dh);ctx.filter='none';ctx.restore();}
function drawPlayer(){if(!player)return;const p=player;const cls=selected,act=p.actT>0?p.act:'idle';let row=0,fi=0;if(act==='claw'){row=2;fi=Math.min(3,Math.floor((14-p.actT)*.31));}else if(act==='tail'){row=3;fi=Math.min(3,Math.floor((19-p.actT)*.24));}else if(act==='special'){row=2;fi=Math.min(3,Math.floor((25-p.actT)*.16));}else if(Math.abs(p.moveX)+Math.abs(p.moveY)>.1){row=1;fi=Math.floor(p.step)%4;}else{row=0;fi=Math.floor(frame/14)%4;}let yy=p.y-p.z;ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(p.x-camera,p.y,29*classes[cls].scale,5,0,0,Math.PI*2);ctx.fill();if(p.invul>0&&Math.floor(frame/4)%2===0)drawXeno(p.x-camera,yy,cls,row,fi,p.face,.35);else drawXeno(p.x-camera,yy,cls,row,fi,p.face,1);if(p.actT>0){ctx.save();ctx.translate(p.x-camera+p.face*13,yy-42);ctx.scale(p.face,1);ctx.globalAlpha=.68;ctx.strokeStyle=act==='special'?'#b6ff6a':act==='tail'?'#83dfff':'#d7c4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,act==='special'?43:32,-1.08,1.08);ctx.stroke();ctx.restore();}}
function drawBoss(){if(!boss)return;const x=boss.x-camera,y=boss.y;ctx.fillStyle='rgba(0,0,0,.54)';ctx.beginPath();ctx.ellipse(x,y,72,10,0,0,Math.PI*2);ctx.fill();const tint=classes[3];const old=classes[selected].hue;ctx.save();ctx.globalAlpha=boss.hurt>0?.55:1;ctx.filter='hue-rotate(28deg) saturate(1.35) brightness(.86)';const im=imgs.xenos,fw=im.naturalWidth/4,fh=im.naturalHeight/4;ctx.drawImage(im,0,0,fw,fh,x-87,y-167,174,167);ctx.filter='none';ctx.restore();if(boss.phase>=2){ctx.strokeStyle='#9dff5b';ctx.globalAlpha=.4;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-85,84,3.2,5.6);ctx.stroke();ctx.globalAlpha=1;}if(boss.hurt>0){ctx.globalAlpha=.25;rect(x-65,y-154,125,150,'#b6ff76');ctx.globalAlpha=1;}}
function drawProjectiles(){for(const b of bullets){const x=b.x-camera;if(b.acid){rect(x-4,b.y-2,9,5,'#9fff48');rect(x-2,b.y-4,4,8,'#caff84');rect(x-1,b.y-1,2,2,'#f5ffbe');}else{rect(x-3,b.y-1,7,3,'#ffc367');rect(x-2,b.y,3,1,'#fff0a2');}}}
function drawFX(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);rect(p.x-camera,p.y,p.size,p.size,p.color);ctx.globalAlpha=1;}for(const t of floaters){ctx.globalAlpha=Math.min(1,t.life/10);txt(t.text,t.x-camera,t.y,7,t.color,'center');ctx.globalAlpha=1;}}
function drawHUD(){rect(0,0,W,31,'#040b13');rect(0,29,W,2,'#859da8');rect(4,3,145,23,'#0c1a27');rect(5,4,143,21,'#24384b');rect(7,6,25,17,'#080e18');const cls=classes[selected];if(imgReady('xenos')){const im=imgs.xenos;ctx.save();ctx.filter=cls.hue;ctx.drawImage(im,0,0,im.naturalWidth/4,im.naturalHeight/4,8,5,23,18);ctx.restore();}txt('1P',37,4,7,'#65dfff');txt(cls.name,37,13,6,'#f2d55c');txt(String(score).padStart(7,'0'),144,5,7,'#eff7ff','right');bar(37,22,107,3,player.hp/player.maxHp,player.hp/player.maxHp<.28?'#f45a4e':'#c4e84f','#4b2730');
 rect(160,4,160,22,'#0a1722');txt('COLONIAL RESEARCH FACILITY',240,7,6,'#93c6d2','center');txt('SECTOR 01  //  LV. 01',240,17,5,'#6f95aa','center');rect(331,4,145,22,'#0a1722');txt('LIVES  '+String(player.lives).padStart(2,'0'),338,6,6,'#f0dfac');txt('HIGH '+String(highScore).padStart(6,'0'),469,6,6,'#b8d3de','right');txt('BIO-ENERGY',338,16,5,'#74dcea');bar(395,17,73,3,player.energy/100,'#6ee7d5','#183845');
 if(boss){rect(48,244,384,24,'#05080f');rect(50,246,380,20,'#1a2934');txt('HIVE GUARDIAN',58,247,6,'#f2db8d');txt('PHASE '+boss.phase,422,247,5,'#b5d9e4','right');bar(58,256,364,7,boss.hp/boss.maxHp,'#cce74b','#681f2b','#9aafba');}
 else{rect(42,248,396,16,'rgba(4,8,14,.85)');txt('ACID / BIO-ENERGY',49,251,5,'#7de3dc');bar(145,251,270,6,player.energy/100,'#77ddcb','#193742');for(let i=0;i<player.lives;i++){rect(423+i*5,251,3,6,'#94c7dd');}}
 if(combo>1&&comboTimer>0){rect(188,37,104,15,'rgba(5,11,18,.85)');txt(combo+' HIT COMBO',240,41,7,'#ffe08b','center');}}
function drawMenu(){if(imgReady('cover')){ctx.drawImage(imgs.cover,0,0,W,H);}else drawBackground();rect(0,0,W,H,'rgba(2,8,15,.48)');rect(0,0,W,31,'rgba(2,8,15,.9)');txt('SEGA 16-BIT STYLE // ORIGINAL ARCADE PROJECT',W/2,9,6,'#9abac6','center');

function drawGame(){drawBackground();ctx.save();if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawCrates();const actors=[];for(const e of enemies){if(!e.dead)actors.push({y:e.y,draw:()=>drawMarine(e)});}if(boss)actors.push({y:boss.y-.5,draw:()=>drawBoss()});if(player)actors.push({y:player.y,draw:()=>drawPlayer()});actors.sort((a,b)=>a.y-b.y).forEach(a=>a.draw());drawProjectiles();drawFX();ctx.restore();drawHUD();if(stageBanner>0){ctx.globalAlpha=Math.min(1,stageBanner/45);rect(100,112,280,35,'rgba(2,7,13,.82)');txt('LEVEL 01',W/2,116,10,'#ffe18d','center');txt('COLONIAL RESEARCH FACILITY',W/2,131,6,'#d6edf1','center');ctx.globalAlpha=1;}}
function render(){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);if(mode==='menu')drawMenu();else if(mode==='playing')drawGame();else if(mode==='paused')drawPause();else drawEnd(mode==='clear');}
function loop(ts){const dt=Math.min(40,ts-(last||ts));last=ts;update(dt||16.67);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
function setKey(k,v){const act=keyMap[k]||keyMap[k.toLowerCase()];if(act)keys[act]=v;}
function toggleFull(){const shell=document.getElementById('shell');if(!document.fullscreenElement)shell.requestFullscreen?.();else document.exitFullscreen?.();}
window.addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();if(k==='f'||k==='F'){toggleFull();return;}if(k==='m'||k==='M'){muted=!muted;setMusic();return;}if(mode==='menu'){if(k>='1'&&k<='4'){selected=Number(k)-1;sfx('select');}else if(k==='ArrowRight'||k.toLowerCase()==='d'){selected=(selected+1)%4;sfx('select');}else if(k==='ArrowLeft'||k.toLowerCase()==='a'){selected=(selected+3)%4;sfx('select');}else if(k==='Enter'||k===' '){startGame();}return;}if(mode==='playing'){if(k==='Escape'){mode='paused';bgm.pause();return;}setKey(k,true);}else if(mode==='paused'){if(k==='Enter'||k==='Escape'){mode='playing';setMusic();}}else if(mode==='gameover'||mode==='clear'){if(k==='Enter')startGame();else if(k==='Escape'){mode='menu';setMusic();}}});
window.addEventListener('keyup',e=>setKey(e.key,false));
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(mode==='menu'){if(y>104&&y<229){const i=Math.max(0,Math.min(3,Math.floor((x-9)/119)));selected=i;sfx('select');}else if(y>230)startGame();}else if(mode==='playing'){if(x<90)keys.left=true;else if(x>390)keys.right=true;else attack('claw');}});
canvas.addEventListener('pointerup',()=>{keys.left=false;keys.right=false;});
document.getElementById('fullBtn').addEventListener('click',toggleFull);document.getElementById('musicBtn').addEventListener('click',()=>{muted=!muted;setMusic();});
window.HIVEBREAK={get mode(){return mode},get selected(){return selected},get score(){return score},startGame,select(i){selected=Math.max(0,Math.min(3,i));},setMode(m){mode=m;},get player(){return player;},get enemies(){return enemies;}};
setMusic();
